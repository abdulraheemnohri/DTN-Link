[workspace]
resolver = "2"
members = [
    "crates/dtn-bpv7",
    "crates/dtn-identity",
    "crates/dtn-storage",
    "crates/dtn-routing",
    "crates/dtn-core",
    "crates/dtn-tcpcl",
    "crates/dtn-daemon",
    "crates/dtn-bpsec",
    "crates/dtn-keyring",
    "crates/dtn-transport",
    "cli",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/abdulraheemnohri/DTN-Link"

[workspace.dependencies]
dtn-bpv7 = { path = "crates/dtn-bpv7" }
dtn-identity = { path = "crates/dtn-identity" }
dtn-storage = { path = "crates/dtn-storage" }
dtn-routing = { path = "crates/dtn-routing" }
dtn-core = { path = "crates/dtn-core" }
dtn-tcpcl = { path = "crates/dtn-tcpcl" }
dtn-daemon = { path = "crates/dtn-daemon" }
dtn-bpsec = { path = "crates/dtn-bpsec" }
dtn-keyring = { path = "crates/dtn-keyring" }
dtn-transport = { path = "crates/dtn-transport" }
ed25519-dalek = "2"
aes-gcm = "0.10"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
